<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-dns-prefetch-control" content="off">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src markfine: data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
   <title>Markfine</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="tabs-trigger" class="tabs-trigger" data-label-zh="显示文档标签页" data-label-en="Show document tabs" aria-label="显示文档标签页"></button>
  <header id="tab-strip" class="tab-strip">
    <button id="toggle-files" class="outline-toggle" aria-expanded="true" hidden data-title-zh="显示／隐藏文件导航" data-title-en="Show / Hide files"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5h6l2 2h8v10H2zM2 7V3h6l2 2h6v2"/></svg><span data-zh="文件" data-en="Files">文件</span></button>
    <button id="toggle-outline" class="outline-toggle" aria-expanded="true" data-title-zh="目录 ⇧⌘L" data-title-en="Outline ⇧⌘L"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M7 3v14M10 7h5M10 10h5M10 13h4"/></svg><span data-zh="目录" data-en="Outline">目录</span></button>
    <nav id="tabs" class="tabs" role="tablist" data-label-zh="文档标签页" data-label-en="Document tabs"></nav><div class="tab-space" data-title-zh="双击新建文档" data-title-en="Double-click to create a document"></div>
    <button id="toggle-source" class="source-toggle" aria-pressed="false" data-title-zh="源码／排版编辑 ⌘/" data-title-en="Source / Live editing ⌘/"><span aria-hidden="true">&lt;/&gt;</span> <span data-zh="源码" data-en="Source">源码</span></button>
    <button id="toggle-reading" class="reading-toggle" data-title-zh="阅读模式 ⇧⌘R" data-title-en="Reading mode ⇧⌘R"><span aria-hidden="true">◉</span> <span data-zh="阅读" data-en="Read">阅读</span></button>
  </header>
  <header id="reading-header" hidden><span class="reading-mode-label" data-zh="阅读模式" data-en="Reading mode">阅读模式</span><button id="document-title" data-title-zh="返回编辑 · Esc / ⇧⌘R" data-title-en="Return to editing · Esc / ⇧⌘R"></button><button id="exit-reading" class="exit-reading" data-zh="返回编辑" data-en="Back to editing">返回编辑</button></header>
  <section id="find-panel" class="find-panel" aria-label="查找与替换" data-label-zh="查找与替换" data-label-en="Find and Replace" hidden>
    <div class="find-row"><button id="find-mode" class="find-mode" aria-expanded="false" data-title-zh="切换查找／替换" data-title-en="Switch Find / Replace">查找 ⇄</button><input id="query" type="text" aria-label="查找" data-label-zh="查找" data-label-en="Find" data-placeholder-zh="在当前文档中查找" data-placeholder-en="Find in this document" autocomplete="off"><span id="matches"></span><button id="find-previous" data-title-zh="上一个 ⇧⌘G" data-title-en="Previous ⇧⌘G">↑</button><button id="find-next" data-title-zh="下一个 ⌘G" data-title-en="Next ⌘G">↓</button><button id="close-find" data-title-zh="关闭 Esc" data-title-en="Close Esc">×</button></div>
    <div id="replace-row" class="find-row" hidden><label for="replacement" data-zh="替换" data-en="Replace">替换</label><input id="replacement" type="text" data-placeholder-zh="替换为" data-placeholder-en="Replace with" autocomplete="off"><button id="replace-one" data-zh="替换" data-en="Replace">替换</button><button id="replace-all" data-zh="全部替换" data-en="Replace all">全部替换</button></div>
  </section>
  <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="dismiss-notice" aria-label="收起提示">×</button></div>
  <button id="resume-position" class="resume-position" hidden></button>
  <div id="paste-progress" class="paste-progress" role="status" hidden><span class="activity" aria-hidden="true"></span><span id="paste-label"></span><button id="retry-paste" hidden data-zh="重试" data-en="Retry">重试</button><button id="local-paste" hidden data-zh="改为本地" data-en="Use local storage">改为本地</button><button id="cancel-paste" data-zh="取消" data-en="Cancel">取消</button></div>
  <div class="workspace"><div id="left-navigation" class="left-navigation">
  <section id="recent-panel" class="recent-panel"><div class="outline-heading"><span data-zh="最近打开" data-en="Recent locations">最近打开</span></div><label class="recent-filter"><input id="show-workspace-recents" type="checkbox"><span data-zh="显示从文件夹导航打开的文件" data-en="Show files opened from folders">显示从文件夹导航打开的文件</span></label><div id="recent-list"></div><p id="recent-empty" data-zh="暂无最近记录" data-en="No recent locations">暂无最近记录</p></section>
  <section id="files-panel" class="files-panel" hidden>
    <div id="files-content" class="files-content">
    <div class="files-heading"><strong id="workspace-name"></strong><span><button id="move-files" data-title-zh="将文件夹导航移到另一侧" data-title-en="Move folders to the other side">⇄</button><button id="refresh-files" data-title-zh="刷新文件树" data-title-en="Refresh files">↻</button><button id="hide-files" data-label-zh="隐藏文件导航" data-label-en="Hide files">‹</button></span></div>
    <label class="all-files"><input id="show-all-files" type="checkbox"><span data-zh="显示全部文件" data-en="Show all files">显示全部文件</span></label>
    <div id="file-tree" role="tree" data-label-zh="文件夹与文件" data-label-en="Folders and files"></div><p id="files-message"></p>
    </div>
  </section>
  <div id="outline-panel" class="outline-panel">
    <aside id="outline" class="outline" data-label-zh="文档目录" data-label-en="Document outline">
      <div class="outline-heading"><span data-zh="目录" data-en="Contents">目录</span><span><button id="move-outline" data-title-zh="将目录移到另一侧" data-title-en="Move outline to the other side">⇄</button><button id="hide-outline" data-label-zh="隐藏目录" data-label-en="Hide outline">‹</button></span></div>
      <div id="outline-tree" role="tree" data-label-zh="Markdown 标题" data-label-en="Markdown headings"></div><p id="outline-empty" data-zh="文档标题会显示在这里" data-en="Your headings will appear here">文档标题会显示在这里</p>
    </aside>
  </div>
  <div id="left-resize" class="navigation-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="360" aria-valuenow="220" data-label-zh="调整左侧导航宽度" data-label-en="Resize left navigation"></div>
  </div>
  <main id="main">
    <div id="editor"></div>
    <section id="reader" class="reader" tabindex="-1" data-label-zh="文档阅读区" data-label-en="Document reading area" hidden><article id="reader-content" class="reading-content markdown-block"></article></section>
    <section id="unsupported" class="unsupported" tabindex="0" hidden><span class="unsupported-icon" aria-hidden="true">◇</span><h2 id="unsupported-name"></h2><p data-zh="不受支持的文件类型" data-en="This file type is not supported">不受支持的文件类型</p><button id="open-unsupported" class="primary" data-zh="使用系统默认程序打开" data-en="Open with the default application">使用系统默认程序打开</button></section>
    <section id="empty" class="empty"><span class="empty-mark" aria-hidden="true">M</span><div class="empty-art" aria-hidden="true"><span class="empty-sun"></span><span class="empty-hill hill-one"></span><span class="empty-hill hill-two"></span></div><h1 data-zh="让文字回到文字。" data-en="A little room for your words.">让文字回到文字。</h1><p id="empty-quote"></p><div id="empty-tips" class="empty-tips"></div><small data-zh="本地文件，属于你。" data-en="Local files. Entirely yours.">本地文件，属于你。</small></section>
  </main>
  <div id="right-navigation" class="right-navigation"><div id="right-resize" class="navigation-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="360" aria-valuenow="220" data-label-zh="调整右侧导航宽度" data-label-en="Resize right navigation"></div></div></div>
  <footer><span id="count">Markdown · UTF-8</span><span id="status" role="status"></span><span id="format-hint" aria-live="polite"></span><div class="zoom-control"><button id="zoom-button" aria-haspopup="menu" aria-expanded="false" data-title-zh="内容缩放" data-title-en="Content zoom">100%</button><div id="zoom-menu" class="zoom-menu" role="menu" hidden></div></div></footer>
  <dialog id="close-dialog"><div class="dialog-rule"></div><h2 id="close-title"></h2><p data-zh="未保存的更改会在放弃后丢失。" data-en="Discarding will lose your unsaved changes.">未保存的更改会在放弃后丢失。</p><div class="dialog-actions"><button data-choice="discard" data-zh="不保存" data-en="Don't save">不保存</button><span></span><button data-choice="cancel" data-zh="取消" data-en="Cancel" autofocus>取消</button><button data-choice="save" class="primary" data-zh="保存" data-en="Save">保存</button></div></dialog>
  <dialog id="help-dialog" class="help-dialog" data-label-zh="快捷键说明" data-label-en="Keyboard shortcuts"></dialog>
  <div id="copy-feedback" class="copy-feedback" role="status" aria-live="polite" hidden></div>
</body>
</html>
